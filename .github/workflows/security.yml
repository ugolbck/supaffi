name: Security

# Static analysis of the code, the workflows and the image. Findings land in
# the repository's Security tab and as annotations on the pull request; none
# of these jobs fail the run on their own, so a new advisory against a base
# image does not block unrelated work. The weekly run is what catches
# advisories published after the code last changed.
#
# Actions are pinned to a commit, not a tag, for the reason spelled out in
# release.yml.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The application code and the workflows themselves. build-mode none reads
  # the source without running the build, so no dependency code runs here.
  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Tests build hostile URLs and hostnames on purpose, and every
          # finding there was a fixture doing its job. They never ship.
          config: |
            paths-ignore:
              - test

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # Workflow misconfiguration CodeQL does not look for: template injection,
  # over-broad token scopes, credentials left in the checkout, unpinned
  # actions. These workflows can publish the image every install pulls.
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action pins itself; the zizmor binary it downloads would float to
      # latest without this.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1

  # Known vulnerabilities in the image as built, base layers included. Only
  # ones with a fix available: an unfixable finding is noise nobody can act on.
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same cache scope as CI's image job, which builds the same thing.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: supaffi:scan
          cache-from: type=gha,scope=ci

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: supaffi:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: image
