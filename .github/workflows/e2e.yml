name: E2E

# The affiliate chain on a running install, through a real browser: owner
# setup, onboarding, affiliate signup, a click on the affiliate link landing
# on the merchant's site, a purchase, and what refunds, disputes and
# self-referrals do to the commission. The stack and its fakes are in e2e/;
# what this cannot reach (public DNS, a real CA, real Stripe) is listed in
# docs/ROADMAP.md.
#
# Actions are pinned to a commit, not a tag, for the reason spelled out in
# release.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affiliate-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image as every install runs it. Reads the layer cache the image
      # scan writes; writes nothing back.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: supaffi:e2e
          cache-from: type=gha,scope=ci

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Three packages; not worth a cache anything else could write to.
          package-manager-cache: false

      # Lifecycle scripts off, as in CI. The browser is fetched explicitly.
      - name: Install Playwright
        working-directory: e2e
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Start the stack
        working-directory: e2e
        run: |
          set -euo pipefail
          docker compose up -d --wait
          for _ in $(seq 1 60); do
            code="$(curl -sk --resolve admin.test:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://admin.test/ || true)"
            case "$code" in 2??|3??) echo "App answered $code."; exit 0 ;; esac
            sleep 2
          done
          echo "The app never answered." >&2
          exit 1

      - name: Run
        working-directory: e2e
        run: npx playwright test

      - name: Logs
        if: failure()
        working-directory: e2e
        run: docker compose logs --no-color --tail 300

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
